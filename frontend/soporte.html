<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soporte · NoExitRooms</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/favicon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Lexend:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <script>/* Transición entre páginas: si se cancela por navegar muy rápido, no es un error */addEventListener("pagereveal",e=>{const v=e.viewTransition;if(v)[v.ready,v.finished,v.updateCallbackDone].forEach(p=>p.catch(()=>{}))});</script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>
  <script src="js/datos-demo.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/movimiento.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/paginas/soporte.js" defer></script>
</head>
<body class="tema-claro" data-zona="panel" data-pagina="soporte" data-rol="agente">
<main>
  <div class="cabecera-pagina"><h1 style="font-size:2rem">Mis tickets</h1></div>
  <div class="metricas" id="metricas"></div>
  <div class="fila-entre">
    <div class="filtros-estado" id="pestanas" role="group" aria-label="Qué tickets ver">
      <button class="boton boton-secundario boton-pequeno" type="button" data-pestana="mios">Asignados a mí</button>
      <button class="boton boton-secundario boton-pequeno" type="button" data-pestana="libres">Sin asignar</button>
    </div>
    <form class="fila" id="filtros"><div class="campo" style="min-width:180px"><label class="solo-lectores" for="estado">Estado</label><select id="estado" name="estado"></select></div><div class="campo" style="min-width:180px"><label class="solo-lectores" for="prioridad">Prioridad</label><select id="prioridad" name="prioridad"></select></div></form>
  </div>
  <div id="lista"></div>
</main>
</body>
</html>
