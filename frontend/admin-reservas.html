<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservas · Administración · NoExitRooms</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/favicon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Lexend:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/panel.css">
  <script src="js/lucide.min.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/paginas/admin-reservas.js" defer></script>
</head>
<body class="tema-claro" data-zona="panel" data-pagina="admin-reservas" data-rol="admin">
<main>
  <div class="cabecera-pagina"><h1 style="font-size:2rem">Reservas</h1><span class="texto-suave" id="contador" aria-live="polite"></span></div>
  <form class="fila" id="filtros" role="search" aria-label="Filtrar reservas">
    <div class="campo" style="min-width:200px"><label class="solo-lectores" for="estado">Estado</label>
      <select id="estado" name="estado">
        <option value="">Todos los estados</option>
        <option value="pendiente" selected>Pendientes de confirmar</option>
        <option value="confirmada">Confirmadas</option>
        <option value="cancelada">Canceladas</option>
      </select>
    </div>
    <label class="casilla"><input type="checkbox" name="pasadas"> Ver también las pasadas</label>
  </form>
  <div id="lista"></div>
</main>
</body>
</html>
