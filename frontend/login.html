<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · NoExitRooms</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/favicon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Lexend:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/lucide.min.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/paginas/login.js" defer></script>
</head>
<body class="tema-oscuro" data-zona="acceso" data-pagina="login">
<main>
  <div class="acceso">
    <img class="acceso-fondo" src="img/acceso.webp" alt="" width="1200" height="2150">
    <div class="acceso-marca">
      <a class="logo" href="index.html"><img src="img/logo-candado-oscuro.png" alt="" width="36" height="36">NoExit<span>Rooms</span></a>
      <div class="acceso-lema">
        <span class="etiqueta-superior">Zona de jugadores</span>
        <h1>La llave ya la tienes.</h1>
        <p>Entra para seguir tus tickets y tus reservas o, si eres del equipo, para atender a los clientes.</p>
      </div>
      <small>Calle del Candado 13, Madrid</small>
    </div>
    <div class="acceso-formulario">
      <form class="formulario acceso-tarjeta" id="form-login" novalidate>
        <img class="acceso-icono" src="img/logo-cerradura-oscuro.png" alt="" width="56" height="56">
        <div class="pila" style="gap:4px">
          <h2>Iniciar sesión</h2>
          <p class="texto-suave">Bienvenido de nuevo.</p>
        </div>
        <div id="aviso-login" aria-live="polite"></div>
        <div class="campo">
          <label for="email">Email</label>
          <div class="campo-icono">
            <i data-lucide="mail" aria-hidden="true"></i>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="tu@email.com" required>
          </div>
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <div class="campo-icono">
            <i data-lucide="lock" aria-hidden="true"></i>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="ver-clave" type="button" aria-label="Mostrar la contraseña" aria-pressed="false"><i data-lucide="eye" aria-hidden="true"></i></button>
          </div>
        </div>
        <button class="boton boton-primario boton-bloque" type="submit">Entrar</button>
        <p class="texto-suave acceso-cambiar">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
        <div class="cuentas-prueba">
          <p>Cuentas de prueba</p>
          <div class="fila">
            <button class="boton boton-secundario boton-pequeno" type="button" data-cuenta="admin@noexitrooms.test">Admin</button>
            <button class="boton boton-secundario boton-pequeno" type="button" data-cuenta="abalos@noexitrooms.test">Agente</button>
            <button class="boton boton-secundario boton-pequeno" type="button" data-cuenta="pedro@ejemplo.test">Cliente</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</main>
</body>
</html>
