# Blueprint de Render: crea la API como servicio web a partir de este repositorio.
# En Render: New > Blueprint > elegir el repo. Los valores marcados con sync: false se rellenan en el panel.
services:
  - type: web
    name: noexitrooms-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_URL
        sync: false
      - key: TOKEN_PASSWORD
        generateValue: true
      - key: TOKEN_EXPIRES
        value: 8h
      - key: CORS_ORIGIN
        value: https://joelmh4.github.io
