openapi: 3.0.3
info:
  title: NoExitRooms API
  version: 0.4.0
  description: |
    API REST de NoExitRooms: salas de escape, reservas y soporte por tickets.
    Las rutas con candado necesitan la cabecera `Authorization: Bearer <token>`,
    que se obtiene con `POST /auth/login`.
servers:
  - url: /api
tags:
  - name: Sistema
    description: Estado del servicio
  - name: Autenticación
    description: Registro e inicio de sesión (públicas)
  - name: Perfil
    description: Datos de la persona que ha iniciado sesión
  - name: Usuarios
    description: Gestión de usuarios y roles (administrador)
  - name: Tickets
    description: |
      Soporte. Cliente: solo sus tickets. Agente: los suyos y los libres (solo trabaja en los suyos).
      Admin: todos. Un ticket que no puedes ver responde 404, aunque exista.
  - name: Categorías
    description: Tipos de ticket (lectura pública, gestión del administrador)
  - name: Panel
    description: Métricas para los paneles del agente y del administrador
  - name: Salas
    description: Catálogo de salas (lectura pública con buscador, CRUD del administrador)
  - name: Reservas
    description: |
      Horarios y reservas. Las horas son de Madrid y van sin zona horaria: `AAAA-MM-DDTHH:MM:SS`.
      Una reserva nace `pendiente` hasta que la confirma el equipo.
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    DatosInvalidos:
      description: Datos incompletos o no válidos (400). `campos` dice qué falla en cada uno.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    SinSesion:
      description: Sin token, token caducado o credenciales incorrectas (401)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Prohibido:
      description: El rol no tiene permiso o la cuenta está desactivada (403)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NoEncontrado:
      description: No existe o no tienes acceso (404)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflicto:
      description: Duplicado o conflicto (409)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  parameters:
    IdTicket: { name: id, in: path, required: true, schema: { type: integer, example: 4 } }
  schemas:
    Sala:
      type: object
      properties:
        id: { type: integer, example: 3 }
        name: { type: string, example: El manicomio de San Tomás }
        slug: { type: string, example: el-manicomio-de-san-tomas }
        theme: { type: string, example: Terror }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        duration_min: { type: integer, minimum: 15, maximum: 180, example: 150 }
        min_players: { type: integer, example: 3 }
        max_players: { type: integer, example: 7 }
        price_per_person: { type: number, example: 26 }
        description: { type: string }
        tagline: { type: string, nullable: true }
        min_age: { type: integer, example: 18 }
        image_url: { type: string, nullable: true, example: img/salas/el-manicomio-de-san-tomas/principal.webp }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DatosSala:
      type: object
      required: [name, theme, difficulty, duration_min, min_players, max_players, price_per_person, description]
      properties:
        name: { type: string, minLength: 3, maxLength: 100, example: La cripta }
        theme: { type: string, minLength: 3, maxLength: 50, example: Misterio }
        difficulty: { type: integer, minimum: 1, maximum: 5, example: 3 }
        duration_min: { type: integer, minimum: 15, maximum: 180, example: 60 }
        min_players: { type: integer, minimum: 1, maximum: 20, example: 2 }
        max_players: { type: integer, minimum: 1, maximum: 20, example: 6, description: No puede ser menor que min_players }
        price_per_person: { type: number, minimum: 0, example: 20 }
        description: { type: string, minLength: 20, maxLength: 5000 }
        tagline: { type: string, maxLength: 150, nullable: true }
        min_age: { type: integer, minimum: 0, maximum: 99, default: 0 }
        image_url: { type: string, nullable: true, description: "Si no se envía: img/salas/<slug>/principal.webp al crear, la que tenía al editar" }
        is_active: { type: boolean, default: true }
    Reserva:
      type: object
      properties:
        id: { type: integer }
        customer_id: { type: integer }
        room_id: { type: integer }
        starts_at: { type: string, example: "2026-10-31T18:00:00" }
        players: { type: integer, example: 5 }
        status: { type: string, enum: [pendiente, confirmada, cancelada] }
        created_at: { type: string, format: date-time }
        sala:
          type: object
          properties: { id: { type: integer }, name: { type: string }, slug: { type: string }, image_url: { type: string, nullable: true } }
        cliente:
          type: object
          properties: { id: { type: integer }, name: { type: string } }
    Rol:
      type: string
      enum: [cliente, agente, admin]
    Estado:
      type: string
      enum: [abierto, en_curso, pendiente_cliente, resuelto, cerrado]
    Prioridad:
      type: string
      enum: [baja, media, alta]
    Persona:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        role: { $ref: "#/components/schemas/Rol" }
    Categoria:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Reservas y cambios de fecha }
        is_active: { type: boolean }
    Ticket:
      type: object
      properties:
        id: { type: integer, example: 4 }
        codigo: { type: string, example: NXR-0004 }
        subject: { type: string }
        description: { type: string }
        priority: { $ref: "#/components/schemas/Prioridad" }
        status: { $ref: "#/components/schemas/Estado" }
        customer_id: { type: integer }
        agent_id: { type: integer, nullable: true }
        category_id: { type: integer }
        room_id: { type: integer, nullable: true }
        booking_id: { type: integer, nullable: true }
        cliente: { $ref: "#/components/schemas/Persona" }
        agente: { type: object, allOf: [{ $ref: "#/components/schemas/Persona" }], nullable: true }
        categoria: { type: string, example: Reservas y cambios de fecha }
        sala:
          type: object
          nullable: true
          properties: { id: { type: integer }, name: { type: string }, slug: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
    TicketDetalle:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          properties:
            mensajes:
              type: array
              description: En orden cronológico. El cliente no recibe las notas internas.
              items:
                type: object
                properties:
                  id: { type: integer }
                  body: { type: string }
                  is_internal: { type: boolean }
                  created_at: { type: string, format: date-time }
                  autor: { $ref: "#/components/schemas/Persona" }
            historial:
              type: array
              description: Cambios de estado en orden cronológico, con quién y cuándo
              items:
                type: object
                properties:
                  old_status: { type: string, allOf: [{ $ref: "#/components/schemas/Estado" }], nullable: true }
                  new_status: { $ref: "#/components/schemas/Estado" }
                  changed_at: { type: string, format: date-time }
                  autor: { $ref: "#/components/schemas/Persona" }
    Usuario:
      type: object
      properties:
        id: { type: integer, example: 4 }
        name: { type: string, example: Lucía Fernández }
        email: { type: string, format: email, example: lucia@ejemplo.test }
        role: { $ref: "#/components/schemas/Rol" }
        is_active: { type: boolean, example: true }
        created_at: { type: string, format: date-time }
    Sesion:
      type: object
      properties:
        token: { type: string, description: "JWT. Se envía en Authorization: Bearer <token>. Caduca a las 8 h." }
        usuario: { $ref: "#/components/schemas/Usuario" }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            codigo: { type: string, example: NO_ENCONTRADO }
            mensaje: { type: string, example: No existe o no tienes acceso. }
            campos:
              type: object
              additionalProperties: { type: string }
              example: { email: Escribe un email válido. }
paths:
  /health:
    get:
      tags: [Sistema]
      summary: Estado de la API y de la conexión con la base de datos
      security: []
      description: No necesita sesión. Devuelve 503 si la API no llega a MySQL.
      responses:
        "200":
          description: Todo funciona
          content:
            application/json:
              schema:
                type: object
                properties:
                  api: { type: string, example: ok }
                  baseDeDatos: { type: string, example: ok }
                  hora: { type: string, format: date-time }
        "503":
          description: La base de datos no responde
  /auth/register:
    post:
      tags: [Autenticación]
      summary: Crear una cuenta de cliente
      security: []
      description: |
        Pública. La cuenta nace SIEMPRE con rol `cliente`: si el cuerpo trae `role`, se ignora.
        La contraseña se guarda con bcrypt. Devuelve la sesión ya iniciada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 100, example: Carla Sanz }
                email: { type: string, format: email, example: carla@ejemplo.test }
                password: { type: string, minLength: 8, description: Mínimo 8 caracteres y al menos un número, example: Secreta123 }
      responses:
        "201": { description: Cuenta creada, content: { application/json: { schema: { $ref: "#/components/schemas/Sesion" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "409": { $ref: "#/components/responses/Conflicto" }
  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      security: []
      description: |
        Pública. Devuelve un token JWT y los datos del usuario. Tras 10 intentos fallidos en 15 minutos
        para el mismo email y la misma IP responde 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: lucia@ejemplo.test }
                password: { type: string, example: Demo1234! }
      responses:
        "200": { description: Sesión iniciada, content: { application/json: { schema: { $ref: "#/components/schemas/Sesion" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "429": { description: Demasiados intentos fallidos }
  /users/me:
    get:
      tags: [Perfil]
      summary: Ver mi perfil
      description: Cualquier rol con sesión.
      security: [{ token: [] }]
      responses:
        "200": { description: Mis datos, content: { application/json: { schema: { $ref: "#/components/schemas/Usuario" } } } }
        "401": { $ref: "#/components/responses/SinSesion" }
    put:
      tags: [Perfil]
      summary: Editar mi nombre y email
      description: Cualquier rol con sesión. El rol no se puede cambiar desde aquí.
      security: [{ token: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                email: { type: string, format: email }
      responses:
        "200": { description: Perfil actualizado, content: { application/json: { schema: { $ref: "#/components/schemas/Usuario" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "409": { $ref: "#/components/responses/Conflicto" }
  /users/me/password:
    put:
      tags: [Perfil]
      summary: Cambiar mi contraseña
      description: Pide la contraseña actual. Cualquier rol con sesión.
      security: [{ token: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actual, nueva]
              properties:
                actual: { type: string }
                nueva: { type: string, minLength: 8, description: Mínimo 8 caracteres y al menos un número }
      responses:
        "204": { description: Contraseña cambiada }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/SinSesion" }
  /users:
    get:
      tags: [Usuarios]
      summary: Listar usuarios
      description: |
        Admin: todos, con filtros. Agente: solo `?role=agente` (para ver a quién se puede asignar un ticket);
        cualquier otra consulta le devuelve 403. Cliente: 403.
      security: [{ token: [] }]
      parameters:
        - { name: role, in: query, schema: { $ref: "#/components/schemas/Rol" }, description: Filtrar por rol }
        - { name: q, in: query, schema: { type: string }, description: Buscar en nombre o email }
      responses:
        "200": { description: Lista de usuarios, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Usuario" } } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/Prohibido" }
  /users/{id}:
    patch:
      tags: [Usuarios]
      summary: Cambiar el rol de un usuario o activarlo/desactivarlo
      description: Solo admin. Un admin no puede cambiarse su propio rol ni desactivarse (409).
      security: [{ token: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: "#/components/schemas/Rol" }
                is_active: { type: boolean }
      responses:
        "200": { description: Usuario actualizado, content: { application/json: { schema: { $ref: "#/components/schemas/Usuario" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }
  /tickets:
    get:
      tags: [Tickets]
      summary: Listar los tickets que puedo ver
      description: Cada rol recibe solo lo suyo (ver la etiqueta Tickets). Los filtros se suman.
      security: [{ token: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Estado" } }
        - { name: priority, in: query, schema: { $ref: "#/components/schemas/Prioridad" } }
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: customer_id, in: query, schema: { type: integer } }
        - { name: agent_id, in: query, schema: { type: string }, description: "Id del agente o `ninguno` para los que están sin asignar" }
        - { name: q, in: query, schema: { type: string }, description: "Busca en asunto y descripción, o por código (NXR-0004)" }
        - { name: orden, in: query, schema: { type: string, enum: [recientes, antiguos, prioridad], default: recientes } }
      responses:
        "200": { description: Tickets, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Ticket" } } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/SinSesion" }
    post:
      tags: [Tickets]
      summary: Abrir un ticket
      description: |
        Cliente o admin. Nace en estado `abierto`; la descripción se guarda también como primer mensaje.
        El admin puede abrirlo en nombre de un cliente con `customer_id`. Si se indica `booking_id`,
        la reserva tiene que ser del cliente y la sala se toma de ella.
      security: [{ token: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, description, category_id]
              properties:
                subject: { type: string, minLength: 5, maxLength: 150, example: Cambio de fecha de la partida }
                description: { type: string, minLength: 20, maxLength: 2000, example: ¿Podemos pasarla al domingo a la misma hora? }
                category_id: { type: integer, example: 1 }
                priority: { allOf: [{ $ref: "#/components/schemas/Prioridad" }], default: media }
                room_id: { type: integer, nullable: true }
                booking_id: { type: integer, nullable: true }
                customer_id: { type: integer, description: Solo admin }
      responses:
        "201": { description: Ticket creado, content: { application/json: { schema: { $ref: "#/components/schemas/TicketDetalle" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/Prohibido" }
  /tickets/{id}:
    parameters: [{ $ref: "#/components/parameters/IdTicket" }]
    get:
      tags: [Tickets]
      summary: Ver un ticket con sus mensajes y su historial
      security: [{ token: [] }]
      responses:
        "200": { description: Ticket, content: { application/json: { schema: { $ref: "#/components/schemas/TicketDetalle" } } } }
        "401": { $ref: "#/components/responses/SinSesion" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    patch:
      tags: [Tickets]
      summary: Cambiar la prioridad o la categoría
      description: El agente que lleva el ticket o el admin.
      security: [{ token: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                priority: { $ref: "#/components/schemas/Prioridad" }
                category_id: { type: integer }
      responses:
        "200": { description: Ticket actualizado, content: { application/json: { schema: { $ref: "#/components/schemas/TicketDetalle" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
  /tickets/{id}/messages:
    parameters: [{ $ref: "#/components/parameters/IdTicket" }]
    post:
      tags: [Tickets]
      summary: Responder en un ticket
      description: |
        El cliente del ticket, el agente que lo lleva o el admin. `is_internal: true` es una nota que el cliente
        no ve (solo equipo). Si el cliente contesta a un ticket `pendiente_cliente`, vuelve a `en_curso`.
        En un ticket cerrado responde 409.
      security: [{ token: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 5000, example: El domingo a las 18:00 está libre. }
                is_internal: { type: boolean, default: false }
      responses:
        "201": { description: Mensaje guardado; devuelve el ticket actualizado, content: { application/json: { schema: { $ref: "#/components/schemas/TicketDetalle" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }
  /tickets/{id}/status:
    parameters: [{ $ref: "#/components/parameters/IdTicket" }]
    patch:
      tags: [Tickets]
      summary: Cambiar el estado
      description: |
        Cada cambio queda en el historial con quién y cuándo.
        - Cliente: de `resuelto` a `cerrado` (confirma el cierre) o a `abierto` (pide reabrir).
        - Agente que lo lleva: cualquier estado menos `cerrado`, y no puede reabrir uno cerrado.
        - Admin: cualquier cambio.
      security: [{ token: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/Estado" }
      responses:
        "200": { description: Estado cambiado, content: { application/json: { schema: { $ref: "#/components/schemas/TicketDetalle" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
  /tickets/{id}/assign:
    parameters: [{ $ref: "#/components/parameters/IdTicket" }]
    patch:
      tags: [Tickets]
      summary: Asignar o reasignar el ticket
      description: Admin a cualquier agente activo (o `null` para dejarlo libre). Un agente solo puede asignarse un ticket libre.
      security: [{ token: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id: { type: integer, nullable: true, example: 2 }
      responses:
        "200": { description: Ticket asignado, content: { application/json: { schema: { $ref: "#/components/schemas/TicketDetalle" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
  /categories:
    get:
      tags: [Categorías]
      summary: Listar categorías
      security: []
      description: Pública, solo las activas. Con `?all=1` también las desactivadas (solo admin).
      parameters:
        - { name: all, in: query, schema: { type: string, enum: ["1"] } }
      responses:
        "200": { description: Categorías, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Categoria" } } } } }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/Prohibido" }
    post:
      tags: [Categorías]
      summary: Crear una categoría
      description: Solo admin.
      security: [{ token: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 3, maxLength: 80, example: Accesibilidad }
      responses:
        "201": { description: Creada, content: { application/json: { schema: { $ref: "#/components/schemas/Categoria" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409": { $ref: "#/components/responses/Conflicto" }
  /categories/{id}:
    put:
      tags: [Categorías]
      summary: Renombrar o activar/desactivar una categoría
      description: Solo admin. Las categorías no se borran, se desactivan (los tickets antiguos la conservan).
      security: [{ token: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 3, maxLength: 80 }
                is_active: { type: boolean }
      responses:
        "200": { description: Actualizada, content: { application/json: { schema: { $ref: "#/components/schemas/Categoria" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }
  /rooms:
    get:
      tags: [Salas]
      summary: Catálogo de salas
      description: Pública, solo las activas. Con `?all=1` también las desactivadas (solo admin, con token).
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Busca en nombre, frase y descripción" }
        - { name: theme, in: query, schema: { type: string, example: Humor } }
        - { name: difficulty, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: players, in: query, schema: { type: integer }, description: Salas en las que cabe ese número de jugadores }
        - { name: orden, in: query, schema: { type: string, enum: [nombre, dificultad, precio, duracion], default: nombre } }
        - { name: all, in: query, schema: { type: string, enum: ["1"] } }
      responses:
        "200": { description: Salas, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Sala" } } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "403": { $ref: "#/components/responses/Prohibido" }
    post:
      tags: [Salas]
      summary: Crear una sala
      description: Solo admin. El slug se genera a partir del nombre.
      security: [{ token: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DatosSala" } } } }
      responses:
        "201": { description: Sala creada, content: { application/json: { schema: { $ref: "#/components/schemas/Sala" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409": { $ref: "#/components/responses/Conflicto" }
  /rooms/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, example: el-manicomio-de-san-tomas }, description: "Id numérico. En GET también vale el slug." }
    get:
      tags: [Salas]
      summary: Ver una sala activa
      description: Pública. Acepta el slug (`el-manicomio-de-san-tomas`) o el id.
      security: []
      responses:
        "200": { description: Sala, content: { application/json: { schema: { $ref: "#/components/schemas/Sala" } } } }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    put:
      tags: [Salas]
      summary: Editar una sala
      description: Solo admin. Se envían todos los datos de la sala (también sirve para desactivarla con `is_active false`).
      security: [{ token: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DatosSala" } } } }
      responses:
        "200": { description: Sala guardada, content: { application/json: { schema: { $ref: "#/components/schemas/Sala" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }
    delete:
      tags: [Salas]
      summary: Borrar una sala
      description: Solo admin. Si tiene tickets o reservas responde 409 y hay que desactivarla.
      security: [{ token: [] }]
      responses:
        "204": { description: Sala borrada }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }
  /rooms/{id}/slots:
    get:
      tags: [Reservas]
      summary: Horarios de una sala con su disponibilidad
      description: |
        Pública. No dice quién ha reservado, solo `libre`, `ocupada` o `pasada`. Si se envía el token de un cliente,
        sus reservas salen como `tuya`. Pases: 10, 12, 16, 18, 20 y 22 h; las salas de más de 2 h, 10, 16 y 19:30.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, example: "2026-10-31" }, description: "Primer día (por defecto, hoy en Madrid)" }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 31, default: 7 } }
      responses:
        "200":
          description: Días con sus horas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    fecha: { type: string, example: "2026-10-31" }
                    horas:
                      type: array
                      items:
                        type: object
                        properties:
                          hora: { type: string, example: "18:00" }
                          starts_at: { type: string, example: "2026-10-31T18:00:00" }
                          estado: { type: string, enum: [libre, ocupada, tuya, pasada] }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
  /bookings:
    get:
      tags: [Reservas]
      summary: Todas las reservas (equipo)
      description: Agente o admin.
      security: [{ token: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pendiente, confirmada, cancelada] } }
        - { name: room_id, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, example: "2026-10-29" } }
      responses:
        "200": { description: Reservas, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Reserva" } } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/Prohibido" }
    post:
      tags: [Reservas]
      summary: Reservar una sala
      description: |
        Solo cliente. La hora tiene que ser un pase de la sala y no haber pasado, y los jugadores tienen que caber.
        Si otra persona tiene ese hueco responde 409.
      security: [{ token: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [room_id, starts_at, players]
              properties:
                room_id: { type: integer, example: 1 }
                starts_at: { type: string, example: "2026-11-07T18:00" }
                players: { type: integer, example: 4 }
      responses:
        "201": { description: Reserva creada (pendiente), content: { application/json: { schema: { $ref: "#/components/schemas/Reserva" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409": { $ref: "#/components/responses/Conflicto" }
  /bookings/me:
    get:
      tags: [Reservas]
      summary: Mis reservas
      description: Solo cliente. De la más lejana a la más antigua.
      security: [{ token: [] }]
      responses:
        "200": { description: Reservas, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Reserva" } } } } }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/Prohibido" }
  /bookings/{id}/status:
    patch:
      tags: [Reservas]
      summary: Confirmar o cancelar una reserva
      description: |
        Agente o admin: confirmar o cancelar. Cliente: solo cancelar una suya que no haya empezado (las de otros dan 404).
        Una reserva cancelada no se recupera; su hueco queda libre para otra reserva.
      security: [{ token: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pendiente, confirmada, cancelada] }
      responses:
        "200": { description: Reserva actualizada, content: { application/json: { schema: { $ref: "#/components/schemas/Reserva" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }
  /stats:
    get:
      tags: [Panel]
      summary: Métricas del panel
      description: |
        Agente: las de sus tickets (más el número de tickets sin asignar). Admin: las de todo el equipo,
        con la carga de cada agente y las reservas. Cliente: 403.
        `activos` son los tickets abiertos, en curso o pendientes del cliente.
      security: [{ token: [] }]
      responses:
        "200":
          description: Métricas
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: object
                    properties:
                      total: { type: integer, example: 5 }
                      activos: { type: integer, example: 3 }
                      por_estado:
                        type: object
                        properties:
                          abierto: { type: integer }
                          en_curso: { type: integer }
                          pendiente_cliente: { type: integer }
                          resuelto: { type: integer }
                          cerrado: { type: integer }
                      activos_por_prioridad:
                        type: object
                        properties: { baja: { type: integer }, media: { type: integer }, alta: { type: integer } }
                      por_categoria:
                        type: array
                        items: { type: object, properties: { id: { type: integer }, name: { type: string }, n: { type: integer } } }
                      sin_asignar:
                        type: object
                        description: Tickets sin agente que no están cerrados (de todo el equipo)
                        properties: { total: { type: integer }, alta: { type: integer } }
                      horas_medias_hasta_resolver: { type: number, nullable: true, example: 2.2, description: Desde que se abre hasta el primer «resuelto» }
                      creados_ultimos_7_dias:
                        type: array
                        items: { type: object, properties: { dia: { type: string, example: "2026-10-27" }, n: { type: integer } } }
                  agentes:
                    type: array
                    description: Solo admin
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        activos: { type: integer }
                        pendientes_cliente: { type: integer }
                        resueltos: { type: integer }
                  reservas:
                    type: object
                    description: Solo admin
                    properties:
                      pendientes_de_confirmar: { type: integer }
                      proximos_7_dias: { type: integer }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/Prohibido" }
